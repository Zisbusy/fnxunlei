<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迅雷推送</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark.css">
</head>

<body>
  <script>
    (function () {
      // 飞牛主题模式:10=浅色, 20=深色, 30=跟随系统
      var THEME_DARK = 20;
      var THEME_OS = 30;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");

      function getThemeType() {
        var v = null;
        try {
          v = localStorage.getItem("os-theme-mode");
          if (v === null || v === "") v = localStorage.getItem("fnos-theme-mode");
        } catch (e) {
          // localStorage 不可用时跟随系统
        }
        return v !== null && v !== "" ? Number(v) : THEME_OS;
      }

      function applyTheme() {
        var t = getThemeType();
        var isDark = t === THEME_DARK || (t === THEME_OS && mq.matches);
        document.body.setAttribute("theme-mode", isDark ? "dark" : "light");
      }

      applyTheme();
      if (mq.addEventListener) mq.addEventListener("change", applyTheme);
      else mq.addListener(applyTheme);

      var last = getThemeType();
      setInterval(function () {
        var now = getThemeType();
        if (now !== last) {
          last = now;
          applyTheme();
        }
      }, 500);
    })();
  </script>

  <div id="app">
    <!-- ============ 左侧导航（只保留两栏） ============ -->
    <div class="sidebar">
      <div class="nav">
        <button class="nav-item active" type="button" id="navPush">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </span>
          <span>推送</span>
        </button>
        <button class="nav-item" type="button" id="navSettings">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
          </span>
          <span>设置</span>
        </button>
      </div>
      <div class="nav-foot">
        <div class="nav-note">
          <span id="footState" class="dot-idle"></span>
          <span id="footText">未登录</span>
        </div>
      </div>
    </div>

    <!-- ============ 右侧主内容 ============ -->
    <div class="main">

      <!-- ------------- 推送 ------------- -->
      <section class="page active" id="page-push">
        <header class="page-head">
          <div>
            <h1>推送下载</h1>
            <p class="page-sub">粘贴链接推送到迅雷远程设备，任务由设备执行</p>
          </div>
          <div class="row-actions">
            <button id="clearLinks" class="ghost-btn" type="button">清空</button>
            <button id="dispatchBtn" class="primary-btn" type="button" disabled>推送下载</button>
          </div>
        </header>

        <div id="loginBanner" class="banner warn hidden">
          还没有登录迅雷账号，请先到「设置」里登录后再推送。
        </div>

        <div class="card settings-card">
          <div class="field">
            <span>下载链接</span>
            <textarea id="linkInput" class="input-area" rows="8"
              placeholder="一行一条，支持混排：&#10;magnet:?xt=urn:btih:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX&#10;thunder://QUFodHRwOi8v...&#10;https://example.com/movie.mkv"></textarea>
            <span class="field-hint" id="linkHint">支持 magnet / thunder / http(s) / ftp，单次最多 20 条。</span>
          </div>
        </div>

        <div id="resultCard" class="card hidden">
          <div class="section-head">
            <h2>推送结果</h2>
            <span id="resultSummary" class="meta">0 / 0</span>
          </div>
          <div id="resultList" class="result-list"></div>
        </div>
      </section>

      <!-- ------------- 设置 ------------- -->
      <section class="page" id="page-settings">
        <header class="page-head">
          <div>
            <h1>设置</h1>
            <p class="page-sub">迅雷账号与推送位置（凭据只保存在本机 NAS）</p>
          </div>
        </header>

        <div class="card settings-card">
          <div class="section-head">
            <h2>迅雷账号</h2>
            <span id="accountBadge" class="badge badge-waiting">未登录</span>
          </div>
          <form id="accountForm" class="grid">
            <div class="field">
              <span>迅雷账号</span>
              <input name="login_name" autocomplete="username" placeholder="手机号或邮箱">
              <span class="field-hint">与迅雷 App 登录的账号一致</span>
            </div>
            <div class="field">
              <span>密码</span>
              <span class="pwd-field">
                <input name="password" id="passwordInput" type="password" autocomplete="current-password" placeholder="未设置">
                <button id="togglePwdBtn" class="eye-btn" type="button" title="显示/隐藏密码">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </span>
              <span class="field-hint">保存后只显示为 ********</span>
            </div>
          </form>
          <div class="form-actions">
            <span id="accountState" class="form-state">未登录</span>
            <span class="spacer"></span>
            <button id="logoutBtn" class="ghost-btn" type="button">退出登录</button>
            <button id="loginBtn" class="primary-btn" type="button">登录</button>
          </div>
        </div>

        <!-- 登录成功后显示：选择设备与保存目录 -->
        <div id="locationCard" class="card settings-card hidden">
          <div class="section-head">
            <h2>下载位置</h2>
            <span id="locationBadge" class="meta">远程设备</span>
          </div>
          <div class="grid">
            <div class="field">
              <span>目标设备</span>
              <select id="targetSelect"></select>
              <span class="field-hint">默认选择账号下第一台在线设备</span>
            </div>
            <div class="field">
              <span>保存目录</span>
              <div id="dirBrowse" class="dir-browser">
                <select id="dirSelect"></select>
              </div>
              <input id="dirText" class="hidden" autocomplete="off" placeholder="例如 movies/2025，留空用设备默认目录">
              <span class="field-hint" id="dirState">设备目录</span>
            </div>
          </div>
          <div class="form-actions">
            <span class="form-state" id="locationState"></span>
            <span class="spacer"></span>
            <button id="refreshDevices" class="ghost-btn" type="button">刷新设备</button>
            <button id="refreshDir" class="ghost-btn" type="button">刷新目录</button>
            <button id="saveLocation" class="primary-btn" type="button">保存</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="ghost-btn" type="button">取消</button>
        <button id="modalOk" class="primary-btn" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- 短信验证弹窗（登录触发迅雷风控时自动弹出） -->
  <div id="reviewModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2>短信验证</h2>
      <p class="modal-tip" id="reviewTip">本次登录触发迅雷风控，需要短信验证一次。</p>
      <div class="review-actions">
        <button id="smsSendBtn" class="ghost-btn" type="button">获取验证码</button>
        <input id="smsCodeInput" class="sms-input" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
        <button id="smsCheckBtn" class="primary-btn" type="button">提交验证</button>
      </div>
      <div class="modal-actions">
        <button id="reviewCancel" class="ghost-btn" type="button">稍后再说</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>

</html>
